ppo:
  num_steps: 128 #int
  ppo_epochs: 4 #int
  mini_batch_size: 256 #int
  clip_epsilon: 0.2 #float
  gamma: 0.99 #float
  gae_lambda: 0.95 #float
  actor_lr: 3.0e-4 #float
  critic_lr: 5e-3 #float
  max_grad_norm: 1.0 #float
  value_loss_coef: 0.5 #float
  entropy_coef: 0.002 #float
  device: "cpu" #str

  # policy / value 网络结构
  actor_hidden_dims: (128, 128, 128) #tuple[int, ...]
  critic_hidden_dims: (128, 128, 128) #tuple[int, ...]
  init_log_std: -0.5 #float

  # task reward 相关超参数
  # 当前 walk 版本里：
  # - pose_weight 主要作为直立姿态奖励的权重
  # - velocity_weight 主要作为速度跟踪奖励的权重
  pose_weight: 0.5 #float
  velocity_weight: 1.0 #float
  command_weight: 0.0 #float
  pose_sigma: 0.25 #float
  velocity_sigma: 0.25 #float

  # regularization reward 相关超参数
  action_weight: 1.0e-3 #float
  smoothness_weight: 1.0e-3 #float
  stability_weight: 0.0 #float

  # total reward 动态权重相关超参数
  sigma_t: 0.15 #float
  sigma_sil: 1.2 #float
  omega_r: 1.0 #float

  # PASIST / SIL 可选开关
  enable_sil: True #bool
  use_skill_selector: True #bool
  discriminator_config_path: "configs/training/discriminator.yaml" #str
  discriminator_batch_size: 256 #int
  discriminator_updates_per_iteration: 1 #int
  sil_buffer_capacity_per_skill: 8 #int
  trajectory_dtw_weight: 0.1 #float
  # 下面三项默认值与当前代码行为保持一致，仅用于后续调参时开放配置接口。
  trajectory_reference_length_ratio: 0.5 #float
  trajectory_normalize_dtw: true #bool
  trajectory_dtw_feature_slices:
    - [6, 18] # 当前只让 DTW 比较 joint_pos_rel

seed:
  seed: 0 #int
